version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendacore
      POSTGRES_USER: vendacore
      POSTGRES_PASSWORD: vendacore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=vendacore;Username=vendacore;Password=vendacore"
      Redis__Connection: "redis:6379"
      Serilog__SeqServerUrl: "http://seq:80"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8080:8080"

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
